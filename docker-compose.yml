services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5050:5050"
    volumes:
      - ./backend/instance:/app/backend/instance
      - ./backend/uploads:/app/backend/uploads
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5050
      - SUMO_BINARY=sumo
    # Uncomment if you want to pass API keys via environment variables instead of a .env file
    # env_file:
    #   - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Port 3000 is exposed internally to Nginx, no need to map to host anymore unless for dev
    expose:
      - "3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:5050
    # Uncomment if you have a .env file for Mapbox keys
    # env_file:
    #   - ./frontend/.env

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
